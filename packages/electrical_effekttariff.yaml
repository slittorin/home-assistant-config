          {% endif %}
          {% if (inputs_valid == true) %}
          {%   set current_max_hour = current_max_hour | int %}
          {%   set current_max_day = current_max_day | int %}
          {%   if (current_max_hour > current_max_day) %}
          {%     set result = current_max_hour %}
          {%   else %}
          {%     set result = current_max_day %}
          {%   endif %}
          {% endif %}
          {{ result }}

