      #    {% set input = states('sensor.balboa_spa_circulationpump_running_time_hour') %}
      #    {% if (input == 'unknown' or input == 'unavailable') %}
      #    {%   set value = 0 %}
      #    {% else %}
      #    {%   set value = float(input, default=0) %}
