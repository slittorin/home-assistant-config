  #binary_sensor:
  #  - platform: ping
  #    name: "Balboa Spa online" # Friendly name for the sensor
  #    host: 192.168.4.20 # Replace with IP or hostname of the device
  #    count: 2 # Number of ping packets to send
  #    scan_interval: 60 # How often to check (in seconds)

  # Send email when Balboa spa is not online.
  # Dependency: A ping sensor towards 192.168.4.20 through GUI.
  - alias: "Send email when Balboa Spa is not online"
    trigger:
      - platform: state
        entity_id: binary_sensor.192_168_4_20
        to: "off"
        for:
          seconds: 180 # Must stay OFF for 180 seconds before triggering
    action:
      - service: notify.email_notification
        data:
          title: "Balboa Spa is offline"
          message: "HA cannot ping Balboa Spa on 192.168.4.20 for 180 seconds. Please turn power off at the Spa, and on after 10 seconds."
  # Send email when Balboa spa is online.
  # Dependency: A ping sensor towards 192.168.4.20 through GUI.
  #  - alias: "Send email when Balboa Spa is online"
  #    trigger:
  #      - platform: state
  #        entity_id: binary_sensor.192_168_4_20
  #        to: "on"
  #    action:
  #      - service: notify.email_notification
  #        data:
  #          title: "Balboa Spa is online"
  #          message: "HA can ping Balboa Spa on 192.168.4.20. Balboa Spa is online."

  # We want to track the spa consumption each 15 minute during the hour.
  - id: automation_balboa_spa_circulationpump_heater_hour_array
    alias: "Automation related to balboa_spa_circulationpump_heater_hour_array"
    trigger:
      - platform: time_pattern
        minutes: "14"
        seconds: "56"
      - platform: time_pattern
        minutes: "29"
        seconds: "56"
      - platform: time_pattern
        minutes: "44"
        seconds: "56"
      - platform: time_pattern
        minutes: "59"
        seconds: "56"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.balboa_spa_circulationpump_heater_hour_array
        data:
          value: >-
            {% set current_array = states('input_text.balboa_spa_circulationpump_heater_hour_array') %}
            {% set current_consumption = states('sensor.shelly_spa_total_active_energy') %}
            {% set current_minute = now().minute %}
            {% set inputs_valid = true %}
            {% set result = none %}
            {% if (current_array == 'unknown' or current_array == 'unavailable' or current_array == 'none' or current_array == None or current_array == "") %}
            {%   set current_array = "[0,0,0,0]" %}
            {% endif %}
            {% set current_array = current_array | from_json %}
            {% if (current_consumption == 'unknown' or current_consumption == 'unavailable') %}
            {%   set inputs_valid = false %}
            {% else %}
            {%   set current_consumption = current_consumption | float %}
            {% endif %}
            {% if (inputs_valid == true) %}
            {%   if (current_minute < 15) %}
            {%     set new_array = [current_consumption] + [current_array[1]] + [current_array[2]] + [current_array[3]] %}
            {%   elif (current_minute >= 15 and current_minute < 30) %}
            {%     set new_array = [current_array[0]] + [current_consumption] + [current_array[2]] + [current_array[3]] %}
            {%   elif (current_minute >= 30 and current_minute < 45) %}
            {%     set new_array = [current_array[0]] + [current_array[1]] + [current_consumption] + [current_array[3]] %}
            {%   elif (current_minute >= 45) %}
            {%     set new_array = [current_array[0]] + [current_array[1]] + [current_array[2]] + [current_consumption] %}
            {%   endif %}
            {%   set result = new_array %}
            {% else %}
            {%   set result = current_array %}
            {% endif %}
            {{ result | tojson }}

  # We want to track the spa consumption cost each 15 minute during the hour.
  # We perform this after electrical_consumption_intake_array is set.
  - id: automation_balboa_spa_circulationpump_heater_cost_hour_array
    alias: "Automation related to balboa_spa_circulationpump_heater_cost_hour_array"
    trigger:
      - platform: time_pattern
        minutes: "14"
        seconds: "57"
      - platform: time_pattern
        minutes: "29"
        seconds: "57"
      - platform: time_pattern
        minutes: "44"
        seconds: "57"
      - platform: time_pattern
        minutes: "59"
        seconds: "57"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.balboa_spa_circulationpump_heater_cost_hour_array
        data:
          value: >-
            {% set current_consumption_array = states('input_text.balboa_spa_circulationpump_heater_hour_array') %}
            {% set current_cost_array = states('input_text.balboa_spa_circulationpump_heater_cost_hour_array') %}
            {% set rate_distribution = states('sensor.electrical_distribution_rate_summary') %}
            {% set rate_consumption = states('sensor.electrical_consumption_rate_summary') %}
            {% set current_minute = now().minute %}
            {% set inputs_valid = true %}
            {% set result = none %}
            {% if (current_consumption_array == 'unknown' or current_consumption_array == 'unavailable' or current_consumption_array == 'none' or current_consumption_array == None or current_consumption_array == "") %}
            {%   set current_consumption_array = "[0,0,0,0]" %}
            {% endif %}
            {% if (current_cost_array == 'unknown' or current_cost_array == 'unavailable' or current_cost_array == 'none' or current_cost_array == None or current_cost_array == "") %}
            {%   set current_cost_array = "[0,0,0,0,0]" %}
            {% endif %}
            {% if (rate_distribution == 'unknown' or rate_distribution == 'unavailable') %}
            {%   set inputs_valid = false %}
            {% else %}
            {%   set rate_distribution = float(rate_distribution, 0) %}
            {% endif %}
            {% if (rate_consumption == 'unknown' or rate_consumption == 'unavailable') %}
            {%   set inputs_valid = false %}
            {% else %}
            {%   set rate_consumption = float(rate_consumption, 0) %}
            {% endif %}
            {% set current_consumption_array = current_consumption_array | from_json %}
            {% set current_cost_array = current_cost_array | from_json %}
            {% if (inputs_valid == true) %}
            {%   if (current_minute < 15) %}
            {%     set delta_consumption = current_consumption_array[0] - current_consumption_array[3] %}
            {%     if (delta_consumption < 0 or current_consumption_array[0] == 0 or current_consumption_array[3] == 0) %}
            {%       set new_cost_array = current_cost_array %}
            {%     else %}
            {%       set delta_cost = (((rate_distribution + rate_consumption)/100) * delta_consumption) | round(5, default=0) %}
            {%       set sum_cost = (delta_cost + current_cost_array[1] + current_cost_array[2] + current_cost_array[3]) | round(5, default=0) %}
            {%       set new_cost_array = [delta_cost] + [current_cost_array[1]] + [current_cost_array[2]] + [current_cost_array[3]] + [sum_cost] %}
            {%     endif %}
            {%   elif (current_minute >= 15 and current_minute < 30) %}
            {%     set delta_consumption = current_consumption_array[1] - current_consumption_array[0] %}
            {%     if (delta_consumption < 0 or current_consumption_array[1] == 0 or current_consumption_array[0] == 0) %}
            {%       set new_cost_array = current_cost_array %}
            {%     else %}
            {%       set delta_cost = (((rate_distribution + rate_consumption)/100) * delta_consumption) | round(5, default=0) %}
            {%       set sum_cost = (current_cost_array[0] + delta_cost + current_cost_array[2] + current_cost_array[3]) | round(5, default=0) %}
            {%       set new_cost_array = [current_cost_array[0]] + [delta_cost] + [current_cost_array[2]] + [current_cost_array[3]] + [sum_cost] %}
            {%     endif %}
            {%   elif (current_minute >= 30 and current_minute < 45) %}
            {%     set delta_consumption = current_consumption_array[2] - current_consumption_array[1] %}
            {%     if (delta_consumption < 0 or current_consumption_array[2] == 0 or current_consumption_array[1] == 0) %}
            {%       set new_cost_array = current_cost_array %}
            {%     else %}
            {%       set delta_cost = (((rate_distribution + rate_consumption)/100) * delta_consumption) | round(5, default=0) %}
            {%       set sum_cost = (current_cost_array[0] + current_cost_array[1] + delta_cost + current_cost_array[3]) | round(5, default=0) %}
            {%       set new_cost_array = [current_cost_array[0]] + [current_cost_array[1]] + [delta_cost] + [current_cost_array[3]] + [sum_cost] %}
            {%     endif %}
            {%   elif (current_minute >= 45) %}
            {%     set delta_consumption = current_consumption_array[3] - current_consumption_array[2] %}
            {%     if (delta_consumption < 0 or current_consumption_array[3] == 0 or current_consumption_array[2] == 0) %}
            {%       set new_cost_array = current_cost_array %}
            {%     else %}
            {%       set delta_cost = (((rate_distribution + rate_consumption)/100) * delta_consumption) | round(5, default=0) %}
            {%       set sum_cost = (current_cost_array[0] + current_cost_array[1] + current_cost_array[2] + delta_cost) | round(5, default=0) %}
            {%       set new_cost_array = [current_cost_array[0]] + [current_cost_array[1]] + [current_cost_array[2]] + [delta_cost] + [sum_cost] %}
            {%     endif %}
            {%   endif %}
            {%   set result = new_cost_array %}
            {% else %}
            {%   set result = current_cost_array %}
            {% endif %}
            {{ result | tojson }}

  # We set the start time for filter cycle 1.
  # We set to default 00:00:00.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_1
  # - balboa_spa_automation_start_filtercycle_2
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_2_start
  # - automation_balboa_spa_automation_set_filter_cycle_1_end
  # - automation_balboa_spa_automation_set_filter_cycle_2_end
  - id: automation_balboa_spa_automation_set_filter_cycle_1_start
    alias: "Automation for automation_set_filter_cycle_1_start"
    trigger:
      - platform: time
        at: "23:59:05"
    condition:
      - condition: state
        entity_id: input_boolean.balboa_spa_automation_toggle
        state: "on"
    action:
      - service: time.set_value
        target:
          entity_id: time.nbp6013h_filtercykeln_1_startar
        data:
          time: >-
            {% set hour_start = states('sensor.balboa_spa_automation_start_filtercycle_1') | int(0) %}
            {{ "%02d:00" | format(hour_start) }}

  # We set the end time for filter cycle 1, only if spa automation is on.
  # Min slot size is 2, max 4. If error, we set to default 2.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_1
  # - balboa_spa_automation_start_filtercycle_2
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_1_start
  # - automation_balboa_spa_automation_set_filter_cycle_2_start
  # - automation_balboa_spa_automation_set_filter_cycle_2_end
  - id: automation_balboa_spa_automation_set_filter_cycle_1_end
    alias: "Automation for balboa_spa_automation_set_filter_cycle_1_end"
    trigger:
      - platform: time
        at: "23:59:10"
    condition:
      - condition: state
        entity_id: input_boolean.balboa_spa_automation_toggle
        state: "on"
    action:
      - service: time.set_value
        target:
          entity_id: time.nbp6013h_filtercykel_1_slutar
        data:
          time: >-
            {% set hour_start = states('sensor.balboa_spa_automation_start_filtercycle_1') | int(0) %}
            {% set slot_size = states('input_number.balboa_spa_automation_filter_cycle_length') | int(2) %}
            {% set slot_size = [slot_size, 2] | max %}
            {% set slot_size = [slot_size, 4] | min %}
            {% set hour_end = hour_start + slot_size %}
            {% if (hour_end > 24) %}
            {%   set hour_end = hour_end - 24 %}
            {% endif %}
            {{ "%02d:00" | format(hour_end) }}

  # We set the start for filter cycle 2.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_1
  # - balboa_spa_automation_start_filtercycle_2
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_1_start
  # - automation_balboa_spa_automation_set_filter_cycle_1_end
  # - automation_balboa_spa_automation_set_filter_cycle_2_end
  - id: automation_balboa_spa_automation_set_filter_cycle_2_start
