  # We set hour for tomorrows lower tariff and filtercycle 1 at 23:59:00 each day.
  # Always revert back to default 0 if not correct data.
  # Slot size is between 2 and 4.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_2
  # - automation_balboa_spa_automation_set_filter_cycle_1_length
  # - automation_balboa_spa_automation_set_filter_cycle_2_length
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_1_start
  # - automation_balboa_spa_automation_set_filter_cycle_2_start
  - trigger:
      - platform: time
        at: "23:59:00"
    sensor:
      - name: balboa_spa_automation_start_filtercycle_1
        unique_id: balboa_spa_automation_start_filtercycle_1
        state_class: measurement
        icon: mdi:clock-outline
        state: >
          {% set slot_size = states('input_number.balboa_spa_automation_filter_cycle_length') | int(2) %}
          {% set slot_size = [slot_size, 2] | max %}
          {% set slot_size = [slot_size, 4] | min %}
          {% set raw_tomorrow = state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'tomorrow') %}
          {% set inputs_valid = true %}
          {% set result = 0 %}
          {% if (raw_tomorrow == 'unknown' or raw_tomorrow == 'unavailable' or raw_tomorrow == 'None' or raw_tomorrow == []) %}
          {%   set inputs_valid = false %}
          {% endif %}
          {% if inputs_valid %}
          {% set raw_tomorrow = raw_tomorrow | list %}
          {%   set ns = namespace(day_h=[]) %}
          {%   for h in range(24) %}
          {%     set b = h * 4 %}
          {%     set ns.day_h = ns.day_h + [(raw_tomorrow[b] + raw_tomorrow[b+1] + raw_tomorrow[b+2] + raw_tomorrow[b+3]) / 4] %}
          {%   endfor %}
          {%   set ns3 = namespace(best1=-1, best2=-1, best_total=999999.0) %}
          {%   set last = 24 - slot_size %}
          {%   for i in range(last) %}
          {%     set ns_ci = namespace(cost=0) %}
          {%     for k in range(slot_size) %}
          {%       set ns_ci.cost = ns_ci.cost + ns.day_h[i + k] %}
          {%     endfor %}
          {%     for j in range(i + slot_size, last) %}
          {%       set ns_cj = namespace(cost=0) %}
          {%       for k in range(slot_size) %}
          {%         set ns_cj.cost = ns_cj.cost + ns.day_h[j + k] %}
          {%       endfor %}
          {%       set total = ns_ci.cost + ns_cj.cost %}
          {%       if total < ns3.best_total %}
          {%         set ns3.best_total = total %}
          {%         set ns3.best1 = i %}
          {%         set ns3.best2 = j %}
          {%       endif %}
          {%     endfor %}
          {%   endfor %}
          {%   if ns3.best1 != -1 %}
          {%     set result = ns3.best1 | int %}
          {%   endif %}
          {% endif %}
          {{ result }}

  # We set hour for tomorrows lower tariff and filtercycle 2 at 23:59:00 each day.
  # Always revert back to default 12 if not correct data.
  # Slot size is between 2 and 4.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_1
  # - automation_balboa_spa_automation_set_filter_cycle_1_length
  # - automation_balboa_spa_automation_set_filter_cycle_2_length
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_1_start
  # - automation_balboa_spa_automation_set_filter_cycle_2_start
  - trigger:
      - platform: time
        at: "23:59:00"
    sensor:
      - name: balboa_spa_automation_start_filtercycle_2
        unique_id: balboa_spa_automation_start_filtercycle_2
        state_class: measurement
        icon: mdi:clock-outline
        state: >
          {% set slot_size = states('input_number.balboa_spa_automation_filter_cycle_length') | int(2) %}
          {% set slot_size = [slot_size, 2] | max %}
          {% set slot_size = [slot_size, 4] | min %}
          {% set raw_tomorrow = state_attr('sensor.nordpool_kwh_se3_sek_3_10_0', 'tomorrow') %}
          {% set inputs_valid = true %}
          {% set result = 12 %}
          {% if (raw_tomorrow == 'unknown' or raw_tomorrow == 'unavailable' or raw_tomorrow == 'None' or raw_tomorrow == []) %}
          {%   set inputs_valid = false %}
          {% endif %}
          {% if inputs_valid %}
          {% set raw_tomorrow = raw_tomorrow | list %}
          {%   set ns = namespace(day_h=[]) %}
          {%   for h in range(24) %}
          {%     set b = h * 4 %}
          {%     set ns.day_h = ns.day_h + [(raw_tomorrow[b] + raw_tomorrow[b+1] + raw_tomorrow[b+2] + raw_tomorrow[b+3]) / 4] %}
          {%   endfor %}
          {%   set ns3 = namespace(best1=-1, best2=-1, best_total=999999.0) %}
          {%   set last = 24 - slot_size %}
          {%   for i in range(last) %}
          {%     set ns_ci = namespace(cost=0) %}
          {%     for k in range(slot_size) %}
          {%       set ns_ci.cost = ns_ci.cost + ns.day_h[i + k] %}
          {%     endfor %}
          {%     for j in range(i + slot_size, last) %}
          {%       set ns_cj = namespace(cost=0) %}
          {%       for k in range(slot_size) %}
          {%         set ns_cj.cost = ns_cj.cost + ns.day_h[j + k] %}
          {%       endfor %}
          {%       set total = ns_ci.cost + ns_cj.cost %}
          {%       if total < ns3.best_total %}
          {%         set ns3.best_total = total %}
          {%         set ns3.best1 = i %}
          {%         set ns3.best2 = j %}
          {%       endif %}
          {%     endfor %}
          {%   endfor %}
          {%   if ns3.best1 != -1 %}
          {%     set result = ns3.best2 | int %}
          {%   endif %}
          {% endif %}
          {{ result }}

