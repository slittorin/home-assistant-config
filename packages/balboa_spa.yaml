  - sensor:
      # We set a preferred rest-temperature, based on the average temperature for today.
      # We have the following logic:
      # - Above 0 degrees celcius = 32 degrees for spa
      # - Between -5 to 0 celcius = 28 degrees for spa
      # - Lower than -5 celcius = 24 degrees for spa
      # Always fall back to 32 degrees.
      - name: Balboa Spa temperature rest temperature to set
        unique_id: balboa_spa_temperature_rest_temperature_to_set
        state_class: measurement
        device_class: "temperature"
        unit_of_measurement: "°C"
        icon: mdi:thermometer-lines
        state: >
          {% set average_temp_today = states('sensor.smhi_daily_average_temperature') %}
          {% set inputs_valid = true %}
          {% set result = none %}
          {% if (average_temp_today == 'unknown' or average_temp_today == 'unavailable' or average_temp_today == none) %}
          {%   set inputs_valid = false %}
          {% else %}
          {%   set average_temp_today = average_temp_today | float %}
          {%   set temperature = 32 %}
          {%   if (average_temp_today >= 0) %}
          {%     set temperature = 31 %}
          {%   elif (average_temp_today >= -5 and average_temp_today < 0) %}
          {%     set temperature = 28 %}
          {%   elif (average_temp_today < -5) %}
          {%     set temperature = 24 %}'
          {%   endif %}
          {% endif %}
          {% if (inputs_valid == true) %}
          {%   set result = 32 %}
          {% endif %}
          {{ result }}

  - trigger:
      # Trigger at the end of every hour, since we want the sensor value to be set for the hour (since this is a state/event driven platform).
      # 20221024: Changed from 59.59 to 59.58 to allow some further yaml to be executed 59.59 each hour.
      # 20230102: Changed from 59.58 to 59.56 to further add space before 59.58 each hour.
      # 20251209: Changed from 59.56 to 59.58 to manage calculations with arrays that occur the second(s) before.
      - platform: time_pattern
        hours: "/1"
        minutes: "59"
        seconds: "58"
    sensor:
      # 20251209: The below sensor is not required anymore since we have the correct consumption from a Shelly-device.
      # We set the cost for the circulation pump
      # We will therefore not capture the last second for the hour.
      # This however means that the hourly consumption will differ a bit, but we never stated that this was a precise sensor ;)
