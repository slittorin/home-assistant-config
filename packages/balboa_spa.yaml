        data:
          time: >-
            {% set hour = states('sensor.balboa_spa_automation_start_filtercycle_2') | int(12) %}
            {{ "%02d:00" | format(hour) }}

  # We set the end time for filter cycle 2, only if spa automation is on.
  # Min slot size is 2, max 4. If error, we set to default 2.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_1
  # - balboa_spa_automation_start_filtercycle_2
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_1_start
  # - automation_balboa_spa_automation_set_filter_cycle_2_start
  # - automation_balboa_spa_automation_set_filter_cycle_1_end
  - id: automation_balboa_spa_automation_set_filter_cycle_2_end
    alias: "Automation for balboa_spa_automation_set_filter_cycle_2_end"
    trigger:
      - platform: time
        at: "23:59:20"
    condition:
      - condition: state
        entity_id: input_boolean.balboa_spa_automation_toggle
        state: "on"
    action:
      - service: time.set_value
        target:
          entity_id: time.nbp6013h_filtercykel_2_slutar
        data:
          time: >-
            {% set hour_start = states('sensor.balboa_spa_automation_start_filtercycle_2') | int(12) %}
            {% set slot_size = states('input_number.balboa_spa_automation_filter_cycle_length') | int(2) %}
            {% set slot_size = [slot_size, 2] | max %}
            {% set slot_size = [slot_size, 4] | min %}
            {% set hour_end = hour_start + slot_size %}
            {% if (hour_end > 24) %}
            {%   set hour_end = hour_end - 24 %}
            {% endif %}
            {{ "%02d:00" | format(hour_end) }}

  # Set the ready-temperature 5 minutes past each hour, only when the spa is in 'rest' mode and spa automation is on.
  # The ready temperature is taken from sensor balboa_spa_temperature_rest_temperature_to_set and defaults to 32 on error.
  # Set also the following sensors/automation for timing:
  # - balboa_spa_automation_start_filtercycle_1
  # - balboa_spa_automation_start_filtercycle_2
  # - automation_balboa_spa_automation_set_temperature_when_ready_mode
  # - automation_balboa_spa_automation_set_filter_cycle_1_start
  # - automation_balboa_spa_automation_set_filter_cycle_2_start
  # - automation_balboa_spa_automation_set_filter_cycle_1_end
  # - automation_balboa_spa_automation_set_filter_cycle_2_end
  - id: automation_balboa_spa_automation_set_temperature_when_ready_mode
    alias: "automation_balboa_spa_automation_set_temperature_when_ready_mode"
    trigger:
      - platform: time_pattern
        minutes: "58"
    condition:
      - condition: template
        value_template: >
          {{ state_attr('climate.nbp6013h_climate', 'preset_mode') == 'rest' }}
      - condition: state
        entity_id: input_boolean.balboa_spa_automation_toggle
        state: "on"
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.nbp6013h_climate
        data:
          temperature: "{{ states('sensor.balboa_spa_temperature_rest_temperature_to_set') | float(32.0) }}"
